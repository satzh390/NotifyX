name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.23.0'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          MONGO_INITDB_DATABASE: notifyx

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run unit tests - API
        working-directory: app/api
        run: go test ./... -v -timeout 5m

      - name: Run unit tests - Core
        working-directory: app/core
        run: go test ./... -v -timeout 5m

      - name: Run unit tests - HTTPX
        working-directory: app/httpx
        run: go test ./... -v -timeout 5m

      - name: Run unit tests - Processor
        working-directory: app/processor
        run: go test ./... -v -timeout 5m

      - name: Run integration tests - API
        working-directory: app/api
        env:
          MONGODB_URI: mongodb://localhost:27017
        run: go test -tags=integration ./... -v -timeout 10m

      - name: Run integration tests - Core
        working-directory: app/core
        env:
          MONGODB_URI: mongodb://localhost:27017
        run: go test -tags=integration ./... -v -timeout 10m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: docker build -f app/api/Dockerfile -t notifyx-api:ci .

      - name: Build Processor Docker image
        run: docker build -f app/processor/Dockerfile -t notifyx-processor:ci .

