openapi: 3.0.3
info:
  title: NotifyX API
  description: Event-driven notification system API
  version: 1.0.0
  contact:
    name: NotifyX Team

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server

tags:
  - name: Subscribers
    description: Subscriber management
  - name: Groups
    description: Group management
  - name: Rules
    description: Notification rules
  - name: Templates
    description: Notification templates

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Subscriber:
      type: object
      required:
        - subscriberId
        - orgId
      properties:
        subscriberId:
          type: string
        orgId:
          type: string
        email:
          type: string
        phone:
          type: string
        pushToken:
          type: string
        webhookUrl:
          type: string
        preferences:
          $ref: '#/components/schemas/SubscriberPrefs'
        groups:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time

    SubscriberPrefs:
      type: object
      properties:
        channels:
          type: object
          additionalProperties:
            type: boolean
        language:
          type: string
        allowedDays:
          type: array
          items:
            type: string
        notificationWindow:
          $ref: '#/components/schemas/TimeWindow'

    TimeWindow:
      type: object
      properties:
        start:
          type: string
        end:
          type: string

    Group:
      type: object
      required:
        - groupId
        - orgId
        - name
      properties:
        groupId:
          type: string
        orgId:
          type: string
        name:
          type: string
        description:
          type: string
        subscribers:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    Rule:
      type: object
      required:
        - eventType
        - orgId
      properties:
        eventType:
          type: string
        orgId:
          type: string
        channels:
          type: array
          items:
            type: string
            enum: [email, sms, push, webhook]
        defaultRecipients:
          $ref: '#/components/schemas/Recipients'
        templateRefs:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time

    Recipients:
      type: object
      properties:
        subscriberIds:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        broadcast:
          type: boolean

    Template:
      type: object
      required:
        - id
        - orgId
        - name
        - channel
        - body
      properties:
        id:
          type: string
        orgId:
          type: string
        name:
          type: string
        channel:
          type: string
          enum: [email, sms, push, webhook]
        version:
          type: integer
        body:
          type: string
        subject:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginationResult:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer

    SubscriberListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscriber'
        pagination:
          $ref: '#/components/schemas/PaginationResult'

    GroupListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        pagination:
          $ref: '#/components/schemas/PaginationResult'

    RuleListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        pagination:
          $ref: '#/components/schemas/PaginationResult'

    Error:
      type: object
      properties:
        message:
          type: string

security:
  - BearerAuth: []

paths:
  /subscribers:
    get:
      tags:
        - Subscribers
      summary: List subscribers
      description: List subscribers with pagination, sorting, and optional group filter
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: sortBy
          in: query
          schema:
            type: string
          description: Format: field:asc or field:desc (e.g., createdAt:desc)
        - name: groupId
          in: query
          schema:
            type: string
          description: Filter by group ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberListResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

    post:
      tags:
        - Subscribers
      summary: Create subscriber
      security:
        - BearerAuth: [notify:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscriber'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /subscribers/{id}:
    get:
      tags:
        - Subscribers
      summary: Get subscriber
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '404':
          description: Not found

    put:
      tags:
        - Subscribers
      summary: Update subscriber
      security:
        - BearerAuth: [notify:write]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscriber'
            description: JSON merge patch - only include fields to update
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '400':
          description: Bad request
        '404':
          description: Not found

    delete:
      tags:
        - Subscribers
      summary: Delete subscriber
      security:
        - BearerAuth: [notify:write]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content
        '404':
          description: Not found

  /groups:
    get:
      tags:
        - Groups
      summary: List groups
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'

    post:
      tags:
        - Groups
      summary: Create group
      security:
        - BearerAuth: [notify:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'

  /groups/{id}:
    get:
      tags:
        - Groups
      summary: Get group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'

    put:
      tags:
        - Groups
      summary: Update group
      security:
        - BearerAuth: [notify:write]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
      responses:
        '200':
          description: Success

    delete:
      tags:
        - Groups
      summary: Delete group
      security:
        - BearerAuth: [notify:write]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content

  /rules:
    get:
      tags:
        - Rules
      summary: List rules
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleListResponse'

    post:
      tags:
        - Rules
      summary: Create rule
      security:
        - BearerAuth: [notify:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rule'
      responses:
        '201':
          description: Created

  /rules/{eventType}:
    get:
      tags:
        - Rules
      summary: Get rule
      parameters:
        - name: eventType
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success

    put:
      tags:
        - Rules
      summary: Update rule
      security:
        - BearerAuth: [notify:write]
      parameters:
        - name: eventType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rule'
      responses:
        '200':
          description: Success

    delete:
      tags:
        - Rules
      summary: Delete rule
      security:
        - BearerAuth: [notify:write]
      parameters:
        - name: eventType
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content

  /templates:
    post:
      tags:
        - Templates
      summary: Create template
      security:
        - BearerAuth: [notify:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Template'
      responses:
        '201':
          description: Created

  /templates/{id}:
    get:
      tags:
        - Templates
      summary: Get template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success

    put:
      tags:
        - Templates
      summary: Update template
      security:
        - BearerAuth: [notify:write]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Template'
      responses:
        '200':
          description: Success

    delete:
      tags:
        - Templates
      summary: Delete template
      security:
        - BearerAuth: [notify:write]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content

