basePath: /api/v1
definitions:
  domain.ChannelType:
    enum:
    - email
    - sms
    - push
    - webhook
    type: string
    x-enum-varnames:
    - ChannelEmail
    - ChannelSMS
    - ChannelPush
    - ChannelWebhook
