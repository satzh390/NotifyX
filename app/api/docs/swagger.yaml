          $ref: '#/definitions/domain.ChannelType'
        type: array
      createdAt:
        type: string
      eventType:
        type: string
      orgId:
        type: string
      templateRefs:
        additionalProperties:
          type: string
        type: object
      updatedAt:
        type: string
    type: object
  domain.Subscriber:
    properties:
      createdAt:
        type: string
      email:
        type: string
      groups:
        items:
          type: string
        type: array
      metadata:
        additionalProperties:
          type: string
        type: object
      orgId:
        type: string
      phone:
        type: string
      preferences:
