      content:
        $ref: '#/definitions/domain.TemplateContent'
      createdAt:
        type: string
      id:
        type: string
      metadata:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      orgId:
        type: string
      translations:
        additionalProperties:
          $ref: '#/definitions/domain.TemplateContent'
        description: 'key: language code (e.g., "en", "es", "fr")'
        type: object
      updatedAt:
        type: string
      version:
        type: integer
    type: object
  domain.TemplateContent:
    properties:
      body:
        type: string
      payload:
        additionalProperties: {}
        description: Webhook content (arbitrary JSON)
        type: object
      subject:
        description: Email content
        type: string
      title:
        description: Push notification content
        type: string
