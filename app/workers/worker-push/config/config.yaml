kafka:
  brokers:
    - "localhost:9092"
  groupId: "notifyx-worker-push"
  topic: "notifyx-worker-push"
  dlqTopic: "notifyx-worker-push-dlq"
  minBytes: 10000
  maxBytes: 1000000
  maxWait: "1s"
  commitInterval: "5s"

storage:
  mongo:
    uri: "mongodb://localhost:27017"
    database: "notifyx"
    collectionPrefix: ""

delivery:
  mode: "mongo" # "mongo", "broker", "both", or "none"
  mongo:
    enabled: true
  broker:
    enabled: false
    taskTopic: "notifyx-delivery-tasks"
    logTopic: "notifyx-delivery-logs"

push:
  provider:
    type: "firebase" # "firebase", "apns", or "mock" for testing
    firebase:
      projectId: ""
      credential: "" # Path to Firebase service account JSON file
    apns:
      keyId: ""
      teamId: ""
      bundleId: ""
      keyPath: ""
      production: false

