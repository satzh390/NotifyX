kafka:
  brokers:
    - "localhost:9092"
  groupId: "notifyx-worker-webhook"
  topic: "notifyx-worker-webhook"
  dlqTopic: "notifyx-worker-webhook-dlq"
  minBytes: 10000
  maxBytes: 1000000
  maxWait: "1s"
  commitInterval: "5s"

storage:
  mongo:
    uri: "mongodb://localhost:27017"
    database: "notifyx"
    collectionPrefix: ""

delivery:
  mode: "mongo" # "mongo", "broker", "both", or "none"
  mongo:
    enabled: true
  broker:
    enabled: false
    taskTopic: "notifyx-delivery-tasks"
    logTopic: "notifyx-delivery-logs"

webhook:
  provider:
    type: "http" # "http" or "mock" for testing
    http:
      timeout: "30s"

