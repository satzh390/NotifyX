apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notifyx.fullname" . }}-api-config
  labels:
    {{- include "notifyx.labels" . | nindent 4 }}
data:
  config.yaml: |
    http:
      addr: "{{ .Values.api.config.httpAddr }}"
    
    oauth:
      issuer: "{{ .Values.api.config.oauthIssuer }}"
      jwks: "{{ .Values.api.config.oauthJwks }}"
      audiences: []
    
    storage:
      mongo:
        uri: "{{ .Values.api.config.mongoURI }}"
        database: "{{ .Values.api.config.mongoDatabase }}"

