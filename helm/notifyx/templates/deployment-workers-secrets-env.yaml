{{- range $worker, $config := .Values.workers }}
{{- if and (eq $worker "push") $.Values.workers.push.secrets.enabled }}
---
# Additional environment variables for APNS secrets
# This shows how to inject secret values as environment variables
# (Alternative to file mounting)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notifyx.fullname" $ }}-worker-push-apns-env-secret
  labels:
    {{- include "notifyx.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker-push
type: Opaque
stringData:
  APNS_KEY_ID: "{{ $.Values.workers.push.secrets.apnsKeyID }}"
  APNS_TEAM_ID: "{{ $.Values.workers.push.secrets.apnsTeamID }}"
  APNS_BUNDLE_ID: "{{ $.Values.workers.push.secrets.apnsBundleID }}"
{{- end }}
{{- end }}

