{{- if .Values.workers.push.secrets.enabled }}
---
# APNS Secret for Push Worker
# This secret can be used for shared APNS keys across multiple apps
# For per-app keys, create separate secrets and mount them, then reference in AppConfig
# Example: Mount secret at /etc/secrets/apns/app1-key.p8 and set AppConfig.apns.keyPath accordingly
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notifyx.fullname" . }}-worker-push-apns-secret
  labels:
    {{- include "notifyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-push
type: Opaque
{{- if .Values.workers.push.secrets.apnsKey }}
data:
  # Base64 encoded APNS key file (.p8)
  # To create: base64 -i /path/to/AuthKey_XXXXXXXXXX.p8 | tr -d '\n'
  apns-key.p8: {{ .Values.workers.push.secrets.apnsKey | b64enc }}
{{- else }}
stringData:
  # Use stringData for plain text (Kubernetes will base64 encode it)
  # Note: Create secret manually using: kubectl create secret generic ...
  # For production, use external secret managers (AWS Secrets Manager, etc.)
  apns-key.p8: ""
{{- end }}
{{- end }}

